<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略參數查詢 — Strategy Dashboard</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3e;
    --text: #e0e0e0; --muted: #6b7280; --accent: #3b82f6;
    --green: #22c55e; --red: #ef4444; --yellow: #f59e0b;
    --purple: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.2rem; font-weight: 700; }
  .back-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card);
              color: var(--muted); text-decoration: none; font-size: 0.82rem; transition: all .2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }

  .tab-bar { display: flex; gap: 6px; padding: 16px 24px 0; flex-wrap: wrap; align-items: center; }
  .tab-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; }
  .tab { padding: 6px 18px; border-radius: 6px; border: 1px solid var(--border); background: var(--card);
         color: var(--muted); cursor: pointer; font-size: 0.85rem; transition: all .2s; }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  main { padding: 20px 24px; max-width: 1400px; }

  /* ── Config cards grid (top 3) ── */
  .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }

  /* ── Optim card (full width below) ── */
  .optim-section { margin-bottom: 20px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .5px; }

  /* Factor bars */
  .factor-row { margin-bottom: 10px; }
  .factor-label { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
  .factor-label span:first-child { color: var(--text); }
  .factor-label .pct-cur { color: var(--accent); font-weight: 600; }
  .factor-label .pct-opt { color: var(--green); font-weight: 600; }
  .bar-bg { background: rgba(255,255,255,.06); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
  .bar-fill.zero { background: var(--border); }
  .bar-fill.opt  { background: var(--green); }

  /* Dual bar */
  .dual-bar-wrap { margin-bottom: 12px; }
  .dual-bar-label { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 3px; }
  .dual-bar-row { display: flex; gap: 6px; align-items: center; }
  .dual-bar-bg { flex: 1; background: rgba(255,255,255,.06); border-radius: 4px; height: 7px; overflow: hidden; }
  .dual-bar-tag { font-size: 0.68rem; color: var(--muted); width: 24px; text-align: center; flex-shrink: 0; }

  /* Sub-weights */
  .sub-section { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .sub-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }

  /* Risk table */
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--border); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
  td { padding: 8px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  td.val-opt { color: var(--green); font-weight: 600; }
  td.val-cur { color: var(--accent); }

  /* Universe */
  .uni-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .uni-item { background: rgba(255,255,255,.03); border-radius: 6px; padding: 10px 12px; }
  .uni-item .u-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
  .uni-item .u-value { font-size: 1.1rem; font-weight: 700; color: var(--text); }

  /* Drawdown levels */
  .dd-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 0.82rem; }
  .dd-thresh { color: var(--red); font-weight: 600; width: 55px; }
  .dd-action { color: var(--muted); }

  /* ── Optim card internals ── */
  .optim-card { border-color: rgba(139,92,246,0.35); }
  .optim-card h3 { color: var(--purple); }

  .meta-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; font-weight: 600; }
  .chip-calmar { background: rgba(139,92,246,0.15); color: var(--purple); border: 1px solid rgba(139,92,246,0.3); }
  .chip-date   { background: rgba(107,114,128,0.12); color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
  .chip-sharpe { background: rgba(34,197,94,0.12);  color: var(--green);  border: 1px solid rgba(34,197,94,0.25); }
  .chip-cagr   { background: rgba(59,130,246,0.12); color: var(--accent); border: 1px solid rgba(59,130,246,0.25); }
  .chip-maxdd  { background: rgba(239,68,68,0.12);  color: var(--red);    border: 1px solid rgba(239,68,68,0.25); }

  .optim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

  /* Top-10 details */
  details { margin-top: 16px; }
  summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); padding: 8px 0;
            border-top: 1px solid var(--border); user-select: none; }
  summary:hover { color: var(--text); }
  .top10-wrap { overflow-x: auto; margin-top: 10px; }
  .top10-wrap table { font-size: 0.78rem; }
  .top10-wrap th, .top10-wrap td { padding: 6px 8px; white-space: nowrap; }
  .top10-wrap tr:first-child td { color: var(--green); font-weight: 600; }

  .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.78rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  .no-data { color: var(--muted); text-align: center; padding: 30px; font-size: 0.85rem; }
  .no-optim { background: rgba(107,114,128,0.05); border: 1px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  #gen-time { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>⚙️ 策略參數查詢</h1>
  <div style="display:flex;gap:10px;align-items:center;">
    <span id="gen-time"></span>
    <a href="index.html" class="back-btn">← 返回監控面板</a>
  </div>
</header>

<!-- Profile tabs -->
<div class="tab-bar" id="profile-tabs">
  <span class="tab-label">組合</span>
  <button class="tab active" onclick="setProfile('focus')">Focus（集中）</button>
  <button class="tab" onclick="setProfile('diversified')">Diversified（分散）</button>
</div>

<!-- Strategy tabs -->
<div class="tab-bar" id="strategy-tabs" style="padding-top:4px;">
  <span class="tab-label">策略</span>
  <button class="tab active" onclick="setStrategy('apka')">APKA</button>
  <button class="tab" onclick="setStrategy('vqmt')">VQMT</button>
</div>

<!-- Market tabs -->
<div class="tab-bar" id="market-tabs" style="padding-top:4px;">
  <span class="tab-label">市場</span>
  <button class="tab active" onclick="setMarket('US')">🇺🇸 美股 US</button>
  <button class="tab" onclick="setMarket('TW')">🇹🇼 台股 TW</button>
  <button class="tab" onclick="setMarket('USETF')">🇺🇸 US ETF</button>
  <button class="tab" onclick="setMarket('TWETF')">🇹🇼 TW ETF</button>
</div>

<main>
  <!-- 目前設定的 3 卡 -->
  <div class="config-grid" id="config-cards">
    <p class="no-data">載入中...</p>
  </div>
  <!-- Grid Search 最佳化結果 -->
  <div class="optim-section" id="optim-section"></div>
</main>

<script>
let PARAMS = null;
let OPTIM  = null;
let currentProfile  = 'focus';
let currentStrategy = 'apka';
let currentMarket   = 'US';

// ── Init ──────────────────────────────────────
async function init() {
  const t = Date.now();
  try {
    const r = await fetch('data/params.json?t=' + t);
    if (!r.ok) throw new Error('params.json not found');
    PARAMS = await r.json();
    document.getElementById('gen-time').textContent = '更新時間：' + (PARAMS.generated_at || '');
  } catch(e) {
    document.getElementById('config-cards').innerHTML =
      '<p class="no-data">⚠️ 參數檔案未找到，請先執行 export_to_web.py</p>';
    return;
  }
  try {
    const r2 = await fetch('data/optim_results.json?t=' + t);
    if (r2.ok) OPTIM = await r2.json();
  } catch(_) {}
  render();
}

// ── Tab helpers ───────────────────────────────
function setProfile(p) {
  currentProfile = p;
  document.querySelectorAll('#profile-tabs .tab').forEach(t =>
    t.classList.toggle('active', t.onclick.toString().includes(`'${p}'`)));
  render();
}
function setStrategy(s) {
  currentStrategy = s;
  document.querySelectorAll('#strategy-tabs .tab').forEach(t =>
    t.classList.toggle('active', t.onclick.toString().includes(`'${s}'`)));
  render();
}
function setMarket(m) {
  currentMarket = m;
  document.querySelectorAll('#market-tabs .tab').forEach(t =>
    t.classList.toggle('active', t.onclick.toString().includes(`'${m}'`)));
  render();
}

// ── Render ────────────────────────────────────
function render() {
  if (!PARAMS) return;

  const pData  = ((((PARAMS.profiles || {})[currentProfile] || {})[currentStrategy] || {})[currentMarket]) || {};
  const fw     = pData.factor_weights || {};
  const risk   = pData.risk || {};
  const uni    = pData.universe || {};

  const oData  = OPTIM
    ? (((OPTIM.results || {})[currentProfile] || {})[currentStrategy] || {})[currentMarket] || null
    : null;

  document.getElementById('config-cards').innerHTML =
    renderFactorCard(fw, currentStrategy) + renderRiskCard(risk, currentStrategy) + renderUniverseCard(uni);

  document.getElementById('optim-section').innerHTML =
    renderOptimCard(oData, fw, risk, currentStrategy);
}

// ── Formatters ───────────────────────────────
function fmtPct(v, decimals=0) {
  if (v === null || v === undefined) return '--';
  return (v * 100).toFixed(decimals) + '%';
}
function fmtBp(v) {
  return (v !== null && v !== undefined) ? v + ' bps' : '--';
}
function fmtM(v) {
  if (v === null || v === undefined) return '--';
  if (v >= 1e9) return (v / 1e9).toFixed(0) + ' B';
  if (v >= 1e6) return (v / 1e6).toFixed(0) + ' M';
  return v;
}
function fmtV(v) { return (v !== null && v !== undefined) ? v : '--'; }

// ── Factor card (current config) ─────────────
function renderFactorCard(fw, strategy) {
  if (strategy === 'apka') {
    return `<div class="card"><h3>📊 因子權重配置（目前設定）</h3>
      <div style="padding:24px 0;text-align:center;color:var(--muted);font-size:0.85rem;line-height:1.8;">
        🤖 APKA 使用 AI 外部評分模組<br>
        <span style="font-size:0.78rem;">因子分數由模型動態計算，無固定因子權重</span>
      </div>
    </div>`;
  }
  const factors = [
    { key: 'value',          label: '價值 Value' },
    { key: 'momentum',       label: '動量 Momentum' },
    { key: 'quality',        label: '品質 Quality' },
    { key: 'tech_trend',     label: '技術趨勢 Tech Trend' },
    { key: 'tech_reversion', label: '技術均值 Tech Reversion' },
  ];
  const techTrend = fw._tech_trend_sub || {};
  const techRev   = fw._tech_reversion_sub || {};

  let bars = factors.map(f => {
    const v = fw[f.key] ?? 0;
    const p = (v * 100).toFixed(0);
    return `<div class="factor-row">
      <div class="factor-label"><span>${f.label}</span><span class="pct-cur">${p}%</span></div>
      <div class="bar-bg"><div class="bar-fill${v===0?' zero':''}" style="width:${p}%"></div></div>
    </div>`;
  }).join('');

  let subHtml = '';
  [['Tech Trend 子指標', techTrend], ['Tech Reversion 子指標', techRev]].forEach(([title, obj]) => {
    const entries = Object.entries(obj).filter(([k]) => !k.startsWith('_') && k !== 'version');
    if (!entries.length) return;
    subHtml += `<div class="sub-section"><div class="sub-title">${title}</div>`;
    entries.forEach(([k, v]) => {
      const p = ((v ?? 0) * 100).toFixed(0);
      subHtml += `<div class="factor-row">
        <div class="factor-label"><span style="color:var(--muted)">${k}</span><span class="pct-cur">${p}%</span></div>
        <div class="bar-bg"><div class="bar-fill${v===0?' zero':''}" style="width:${p}%;background:rgba(59,130,246,0.5)"></div></div>
      </div>`;
    });
    subHtml += '</div>';
  });

  return `<div class="card"><h3>📊 因子權重配置（目前設定）</h3>${bars}${subHtml}</div>`;
}

// ── Risk card (current config) ────────────────
function renderRiskCard(risk, strategy) {
  let rows;
  if (strategy === 'apka') {
    rows = [
      ['再平衡頻率',    fmtV(risk.rebalance_freq)],
      ['持股數 Top-N',  fmtV(risk.top_n)],
      ['單股最大權重',  fmtPct(risk.max_weight)],
      ['單股最小權重',  fmtPct(risk.min_weight)],
      ['目標波動率',    fmtPct(risk.target_volatility)],
      ['最大回撤停損',  fmtPct(risk.max_drawdown)],
      ['追蹤停損閾值',  fmtPct(risk.trailing_stop_threshold)],
      ['廣度警告閾值',  fmtPct(risk.breadth_warn)],
      ['廣度熊市閾值',  fmtPct(risk.breadth_bear)],
      ['最大相關性',    risk.max_corr != null ? String(risk.max_corr) : '--'],
      ['手續費成本',    fmtBp(risk.commission_bp)],
      ['滑點估計',      fmtBp(risk.slippage_bp)],
      ['交易稅',        fmtBp(risk.tax_bp)],
    ];
    return `<div class="card"><h3>🛡️ 風控參數（目前設定）</h3>
      <table><thead><tr><th>參數</th><th>設定值</th></tr></thead><tbody>
        ${rows.map(([l,v]) => `<tr><td>${l}</td><td class="val-cur">${v}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  // VQMT
  rows = [
    ['單股最大權重',  fmtPct(risk.max_weight)],
    ['單股最小權重',  fmtPct(risk.min_weight)],
    ['目標波動率',    fmtPct(risk.target_volatility)],
    ['最大回撤停損',  fmtPct(risk.max_drawdown)],
    ['追蹤停損',      fmtPct(risk.trailing_drawdown)],
    ['手續費成本',    fmtBp(risk.commission_bp)],
    ['滑點估計',      fmtBp(risk.slippage_bp)],
    ['交易稅',        fmtBp(risk.tax_bp)],
  ];
  const ddLevels = risk.drawdown_levels || [];
  const ddHtml = ddLevels.map(d =>
    `<div class="dd-row">
      <span class="dd-thresh">${d.threshold ? (d.threshold*100).toFixed(0)+'%' : '--'}</span>
      <span class="dd-action">→ ${d.action || ''}</span>
    </div>`).join('');
  return `<div class="card"><h3>🛡️ 風控參數（目前設定）</h3>
    <table><thead><tr><th>參數</th><th>設定值</th></tr></thead><tbody>
      ${rows.map(([l,v]) => `<tr><td>${l}</td><td class="val-cur">${v}</td></tr>`).join('')}
    </tbody></table>
    ${ddLevels.length ? `<div class="sub-section"><div class="sub-title">回撤分級處置</div>${ddHtml}</div>` : ''}
  </div>`;
}

// ── Universe card ─────────────────────────────
function renderUniverseCard(uni) {
  const desc = uni.description || '';
  return `<div class="card"><h3>🌐 選股範圍 Universe</h3>
    ${desc ? `<p style="font-size:0.8rem;color:var(--muted);margin-bottom:14px;">${desc}</p>` : ''}
    <div class="uni-grid">
      <div class="uni-item"><div class="u-label">最少持股數</div><div class="u-value">${fmtV(uni.min_stocks)}</div></div>
      <div class="uni-item"><div class="u-label">目標持股數</div><div class="u-value">${fmtV(uni.target_stocks)}</div></div>
      <div class="uni-item"><div class="u-label">最大股池</div><div class="u-value">${fmtV(uni.max_stocks)}</div></div>
      <div class="uni-item"><div class="u-label">最小市值</div><div class="u-value">${fmtM(uni.min_market_cap_usd)}</div></div>
      <div class="uni-item"><div class="u-label">最小日均成交</div><div class="u-value">${fmtM(uni.min_adv_usd)}</div></div>
    </div>
  </div>`;
}

// ── Optim card ────────────────────────────────
function renderOptimCard(oData, curFw, curRisk, strategy) {
  if (!OPTIM) {
    return `<div class="card optim-card">
      <h3>🔬 Grid Search 最佳化結果</h3>
      <div class="no-optim">⚠️ optim_results.json 未找到，請先執行 export_to_web.py</div>
    </div>`;
  }
  if (!oData) {
    return `<div class="card optim-card">
      <h3>🔬 Grid Search 最佳化結果</h3>
      <div class="no-optim">此市場 / 策略組合尚未執行最佳化<br>
        <span style="font-size:0.78rem;">執行 optimize_params.py 後再重新匯出</span></div>
    </div>`;
  }

  // ── Meta chips ──
  const meta = oData.meta || {};
  const fp   = oData.full_period;
  let chips = '';
  if (meta.wf_calmar != null)
    chips += `<span class="chip chip-calmar">🏆 WF-Calmar ${parseFloat(meta.wf_calmar).toFixed(4)}</span>`;
  if (meta.generated_at)
    chips += `<span class="chip chip-date">📅 ${meta.generated_at}</span>`;
  if (fp) {
    chips += `<span class="chip chip-sharpe">Sharpe ${fp.sharpe}</span>`;
    chips += `<span class="chip chip-cagr">CAGR ${fp.cagr}%</span>`;
    chips += `<span class="chip chip-maxdd">MaxDD ${fp.max_dd}%</span>`;
  }

  // ── Factor weights comparison (VQMT only) ──
  let fwSection = '';
  if (oData.factor_weights) {
    const ofw = oData.factor_weights;
    const factors = [
      { key: 'value',          label: '價值 Value' },
      { key: 'momentum',       label: '動量 Momentum' },
      { key: 'quality',        label: '品質 Quality' },
      { key: 'tech_trend',     label: '技術趨勢' },
      { key: 'tech_reversion', label: '技術均值' },
    ];
    let dualBars = factors.map(f => {
      const cur = (curFw[f.key] ?? 0) * 100;
      const opt = (ofw[f.key]  ?? 0) * 100;
      return `<div class="dual-bar-wrap">
        <div class="dual-bar-label">
          <span style="font-size:0.82rem;">${f.label}</span>
          <span>
            <span style="color:var(--accent);font-size:0.78rem;">${cur.toFixed(0)}%</span>
            <span style="color:var(--muted);font-size:0.78rem;"> → </span>
            <span style="color:var(--green);font-size:0.78rem;font-weight:600;">${opt.toFixed(0)}%</span>
          </span>
        </div>
        <div class="dual-bar-row">
          <span class="dual-bar-tag" style="color:var(--accent);">現</span>
          <div class="dual-bar-bg"><div class="bar-fill${cur===0?' zero':''}" style="width:${cur.toFixed(0)}%"></div></div>
        </div>
        <div class="dual-bar-row" style="margin-top:2px;">
          <span class="dual-bar-tag" style="color:var(--green);">優</span>
          <div class="dual-bar-bg"><div class="bar-fill opt${opt===0?' zero':''}" style="width:${opt.toFixed(0)}%"></div></div>
        </div>
      </div>`;
    }).join('');
    fwSection = `<div>
      <h3 style="font-size:0.82rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">因子權重對比</h3>
      <div class="legend" style="margin-bottom:10px;">
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div><span style="font-size:0.78rem;color:var(--muted)">現 = 目前設定</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div><span style="font-size:0.78rem;color:var(--muted)">優 = 最佳化建議</span></div>
      </div>
      ${dualBars}
    </div>`;
  } else {
    fwSection = `<div style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.82rem;padding:20px 0;">
      APKA 策略因子分數由外部評分模組計算，<br>此次優化僅涵蓋風控參數</div>`;
  }

  // ── Risk comparison table ──
  const orisk = oData.risk || {};
  const isApka = strategy === 'apka';
  const riskRows = isApka ? [
    ['再平衡頻率',    fmtV(curRisk.rebalance_freq),              fmtV(orisk.rebalance_freq)],
    ['持股數 Top-N',  fmtV(curRisk.top_n),                       fmtV(orisk.top_n)],
    ['目標波動率',    fmtPct(curRisk.target_volatility),         fmtPct(orisk.target_volatility)],
    ['單股最大權重',  fmtPct(curRisk.max_weight),                fmtPct(orisk.max_weight)],
    ['最大回撤停損',  fmtPct(curRisk.max_drawdown),              fmtPct(orisk.max_drawdown)],
    ['追蹤停損閾值',  fmtPct(curRisk.trailing_stop_threshold),   fmtPct(orisk.trailing_stop)],
    ['廣度警告閾值',  fmtPct(curRisk.breadth_warn),              fmtPct(orisk.breadth_warn)],
    ['廣度熊市閾值',  fmtPct(curRisk.breadth_bear),              fmtPct(orisk.breadth_bear)],
    ['最大相關性',    curRisk.max_corr != null ? String(curRisk.max_corr) : '--',
                      orisk.max_corr != null ? String(orisk.max_corr) : '--'],
  ] : [
    ['目標波動率',    fmtPct(curRisk.target_volatility), fmtPct(orisk.target_volatility)],
    ['單股最大權重',  fmtPct(curRisk.max_weight),        fmtPct(orisk.max_weight)],
    ['最大回撤停損',  fmtPct(curRisk.max_drawdown),      fmtPct(orisk.max_drawdown)],
    ['追蹤停損閾值',  fmtPct(curRisk.trailing_drawdown), fmtPct(orisk.trailing_stop)],
    ['廣度警告閾值',  '--',                               fmtPct(orisk.breadth_warn)],
    ['廣度熊市閾值',  '--',                               fmtPct(orisk.breadth_bear)],
    ['最大相關性',    '--',                               orisk.max_corr != null ? String(orisk.max_corr) : '--'],
    ['再平衡頻率',    '--',                               fmtV(orisk.rebalance_freq)],
    ['持股數 Top-N',  '--',                               fmtV(orisk.top_n)],
  ];
  const riskSection = `<div>
    <h3 style="font-size:0.82rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">風控參數對比</h3>
    <table>
      <thead><tr><th>參數</th><th style="color:var(--accent)">目前設定</th><th style="color:var(--green)">最佳化建議</th></tr></thead>
      <tbody>
        ${riskRows.map(([l,c,o]) =>
          `<tr><td>${l}</td><td class="val-cur">${c}</td><td class="val-opt">${o}</td></tr>`
        ).join('')}
      </tbody>
    </table>
  </div>`;

  // ── Top 10 trials ──
  let top10Html = '';
  if (oData.top10 && oData.top10.length) {
    const cols = Object.keys(oData.top10[0]);
    const colLabels = {
      wf_calmar: 'WF-Calmar', rebalance_freq: '再平衡', target_vol: '目標波動',
      max_drawdown: '最大DD', max_single_weight: '單股上限',
      trailing_stop_threshold: '追蹤停損',
      w_momentum: '動量', w_value: '價值', w_quality: '品質',
      w_tech_trend: 'TechT', w_tech_reversion: 'TechR',
    };
    top10Html = `<details>
      <summary>▶ 展開 Top 10 優化試驗（共 ${oData.top10.length} 筆）</summary>
      <div class="top10-wrap">
        <table>
          <thead><tr>${cols.map(c => `<th>${colLabels[c] || c}</th>`).join('')}</tr></thead>
          <tbody>
            ${oData.top10.map(row =>
              `<tr>${cols.map(c => {
                let v = row[c];
                if (typeof v === 'number' && c !== 'wf_calmar') v = (v * 100).toFixed(1) + '%';
                else if (c === 'wf_calmar') v = parseFloat(v).toFixed(4);
                return `<td>${v ?? '--'}</td>`;
              }).join('')}</tr>`
            ).join('')}
          </tbody>
        </table>
      </div>
    </details>`;
  }

  return `<div class="card optim-card">
    <h3>🔬 Grid Search 最佳化結果（${currentStrategy.toUpperCase()} · ${currentMarket}）</h3>
    <div class="meta-chips">${chips}</div>
    <div class="optim-grid">
      ${fwSection}
      ${riskSection}
    </div>
    ${top10Html}
  </div>`;
}

init();
</script>
</body>
</html>
